    <script type="text/javascript">
        window.__dbgLog = window.__dbgLog || function () {};
        window.addEventListener('keydown', function (event) {
            if (event.keyCode !== 27 && event.which !== 27 && event.code !== 'Escape') return;
            event.preventDefault();
            if (event.stopPropagation) event.stopPropagation();
            try {
                var v = (typeof palyerMainMenuMenu !== 'undefined' && palyerMainMenuMenu.vue)
                    ? palyerMainMenuMenu.vue
                    : null;
                var capturing = !!(v && v.binderSelectKey != null && v.binderSelectKey >= 0);
                if (capturing || (window.__pmEscCancelUntil && Date.now() < window.__pmEscCancelUntil)) {
                    if (event.stopImmediatePropagation) event.stopImmediatePropagation();
                    window.__pmEscCancelUntil = Date.now() + 500;
                    if (capturing) {
                        if (typeof window.cancelBinderCaptureFromEsc === 'function') {
                            window.cancelBinderCaptureFromEsc();
                        } else if (typeof window.flowEscClearBinderCapture === 'function') {
                            window.flowEscClearBinderCapture();
                        } else if (v) {
                            v.binderSelectKey = -1;
                        }
                    }
                    try { mp.trigger('flowMenuBinderCaptureEsc'); } catch (_eTrig) {}
                    return false;
                }
                if (typeof window.bloodMenuEscShouldClose === 'function' && !window.bloodMenuEscShouldClose()) {
                    if (event.stopImmediatePropagation) event.stopImmediatePropagation();
                    return false;
                }
            } catch (_e0) {}
            try { mp.trigger('playermenu:cef:esc'); } catch (_e) {}
            return false;
        }, true);
        window.addEventListener('keyup', function (event) {
            if (event.keyCode !== 27 && event.which !== 27 && event.code !== 'Escape') return;
            if (window.__pmEscCancelUntil && Date.now() < window.__pmEscCancelUntil) {
                event.preventDefault();
                if (event.stopPropagation) event.stopPropagation();
                if (event.stopImmediatePropagation) event.stopImmediatePropagation();
                return false;
            }
        }, true);
    </script>

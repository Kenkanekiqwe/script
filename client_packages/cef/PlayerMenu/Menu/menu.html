    <style>
        .playerMenu-header-button {
            position: relative;
            padding: 5px 10px;
            font-family: Montserrat;
            font-style: normal;
            font-weight: 500;
            font-size: 18px;
            color: #719AD8;
        }
        .playerMenu-header-button.active {
            color: #fff;
        }
        .playerMenu-header-button.active:before {
            content: '';
            position: absolute;
            width: 110%;
            height: 5px;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            background: #FFFFFF;
            box-shadow: 0px 10px 75px rgba(68, 132, 255, 0.79);
            pointer-events: none;
        }

        .playerMenu-scroll::-webkit-scrollbar-track {
            background-color: #0F2B55;
        }

        .playerMenu-infoBlock {
            padding: 15px;
            background: rgba(22, 26, 48, 0.5);
            border-radius: 5px;
        }
        .playerMenu-infoBlock-estate {
            display: inline-flex; 
            flex-direction: column; 
            width: 215px; 
            height: 138px; 
            margin: 2.5px;
        }
        .playerMenu-infoBlock-estate-line {
            display: flex;
            font-family: Montserrat;
            font-weight: 500;
            font-size: 16px;
            padding-bottom: 3px; 
            border-bottom: 1px solid #213B62;
            color: #fff;
            margin-top: 5px;
        }
        .playerMenu-infoBlock-estate-line:last-child {
            border-bottom: none;
        }
        .playerMenu-skillBlock {
            background: rgba(22, 26, 48, 0.5); 
            border-radius: 0px 0px 5px 5px; 
            padding: 10px 10px 10px 15px;
        }
        .playerMenu-skillBlock-content {
            overflow-y: auto;
            padding-right: 5px;
        }
        .playerMenu-skillBlock-content::-webkit-scrollbar {
            width: 5px;
        }
        .playerMenu-skillBlock-content::-webkit-scrollbar-track {
            width: 5px;
            border-radius: 2px;
            background: #0F2B55;
        }
        .playerMenu-skillBlock-content::-webkit-scrollbar-thumb {
            width: 5px;
            background: #34517C;
            border-radius: 2px;
        }

        .playerMenu-shop-item-block {
            position: relative;
            padding: 10px;
            background: rgba(22, 26, 48, 0.5);
            border-radius: 50px 0px 0px 50px;
        }
        .playerMenu-shop-item-block:hover {
            background: rgba(189, 203, 240, 0.1);
        }
        .playerMenu-shop-item-desc {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translate(-50%, -100%);
            width: 70%;
            background: #23467A;
            box-shadow: 0px 0px 33px rgba(0, 0, 0, 0.49);
            border-radius: 12px;
            padding: 15px 5px;
            text-align: center;
            z-index: 9999;
            display: none;
            pointer-events: none;
        }
        .playerMenu-shop-item-block:hover ~ .playerMenu-shop-item-desc {
            display: inline-block;
        }
        .playerMenu-shop-button {
            position: relative;
            font-size: 16px;
            padding: 15px 25px;
            background: rgba(149, 191, 255, 0.1);
            border-radius: 4px;
        }
        .playerMenu-shop-button:hover {
            background: rgba(201, 222, 255, 0.23);
        }
        .playerMenu-shop-table-line {
            display: flex;
            flex-shrink: 0;
        }
        .playerMenu-shop-table-line-data {
            padding: 10px 0px;
            font-family: Montserrat;
            font-style: normal;
            font-weight: 500;
            font-size: 20px;
            text-align: center;
            color: #FFFFFF;
            background: rgba(223, 236, 255, 0.09);
        }
        .playerMenu-shop-table-line:nth-child(even) .playerMenu-shop-table-line-data {
            background: rgba(77, 113, 166, 0.17);
        }
        .playerMenu-shop-table-line-data-main {
            font-family: Montserrat;
            font-style: normal;
            font-weight: 600;
            font-size: 16px;
            text-align: right;
            padding-right: 10px;
            box-sizing: border-box;
            color: #E0F0FF;
        }
        .playerMenu-shop-scroll::-webkit-scrollbar {
            width: 5px;
        }
        .playerMenu-shop-scroll::-webkit-scrollbar-track {
            width: 5px;
            border-radius: 2px;
            background: rgba(164, 189, 255, 0.1);
        }
        .playerMenu-shop-scroll::-webkit-scrollbar-thumb {
            width: 5px;
            background: rgba(185, 205, 255, 0.24);
            border-radius: 2px;
        }

        .bonusPointShopItem-wrapper {
            position: relative;
            margin-bottom: 10px;
        }
        .bonusPointShopItem-item {
            position: relative;
            height: 130px;
            width: 130px;
            background: url(UI/MainMenu/bp-bg.png);
            background-repeat: no-repeat;
            background-position: center;
            background-size: 100% 100%;
            border-radius: 15px;
            transition: 0.4s all;
        }
        .bonusPointShopItem-item:hover {
            box-shadow: 0px 0px 20px 0px #00A3FF;
        }
        .bonusPointShopItem-item-image {
            position: absolute;
            max-height: 90px;
            max-width: 90px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }
        .bonusPointShopItem-item-name {
            text-align: center;
            margin-top: 10px;
            width: 130px;
            font-size: 12px;
            pointer-events: none;
            z-index: 2;
        }
        .bonusPointShopItem-item-price {
            position: absolute;
            left: -2px;
            bottom: -2px;
            padding: 5px;
            background: linear-gradient(90deg, rgba(0,224,255,1) 0%, rgba(0,102,255,1) 100%);
            border-radius: 5px;
            pointer-events: none;
            z-index: 3;
        }

        .playerMenu-setting-line {
            display: flex;
            align-items: center;
            margin-top: 5px;
            background: rgba(22, 26, 48, 0.5);
            border-radius: 8px;
            padding: 10px 10px;
        }
        .playerMenu-setting-line-inline {
            margin-top: 0px;
            display: inline-flex;
        }
        .playerMenu-setting-line:first-child {
            margin-top: 0px;
        }
        .playerMenu-setting-text {
            font-family: Montserrat;
            font-style: normal;
            font-weight: 500;
            font-size: 16px;
            color: #71A4DF;
        }
        .playerMenu-setting-value {
            margin-left: auto;
        }
        .playerMenu-setting-checkbox-block {
            display: flex;
            align-items: center;
            user-select: none;
        }
        .playerMenu-setting-checkbox {
            position: relative;
            height: 27px;
            width: 72px;
            background: linear-gradient(90deg, #FF0F00 0%, #D0004B 100%);
            border-radius: 121px;
            -webkit-appearance: none;
            appearance: none;
        }
.playerMenu-setting-checkbox:checked {
            background: linear-gradient(270deg, #DBFF00 0%, #00AA3A 100%);
        }
        .playerMenu-setting-checkbox:before {
            content: 'Нет';
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            font-family: Montserrat;
            font-style: normal;
            font-weight: 600;
            font-size: 14px;
            line-height: 17px;
            text-align: center;
            color: #FFFFFF;
            text-shadow: 0px 1px 2px #4B3FCF;
        }
        .playerMenu-setting-checkbox:checked:before {
            content: 'Да';
            right: calc(95% - 35px);
        }
        .playerMenu-setting-checkbox:after {
            content: '';
            position: absolute;
            top: calc(50% - 1px);
            left: 2.5px;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
        }
        .playerMenu-setting-checkbox:checked:after {
            display: block;
            left: calc(95% - 20px);
        }

        .playerMenu-setting-reticle-type-item {
            width: 155px;
            padding: 10px 15px;
            background: rgba(22, 26, 48, 0.5);
            border-radius: 8px;
            font-family: Montserrat;
            font-style: normal;
            font-weight: 500;
            font-size: 16px;
            text-align: center;
            color: #71A4DF;
        }
        .playerMenu-setting-reticle-type-item:hover {
            background: rgba(22, 26, 48, 0.26);
        }
        .playerMenu-setting-reticle-type-item.active {
            background: rgba(75, 144, 248, 0.21);
        }
        .playerMenu-setting-reticle-param-item-block {
            padding: 10px 15px;
            background: rgba(22, 26, 48, 0.5);
            border-radius: 8px;
        }
        .playerMenu-setting-reticle-param-item-progress .rangeslider.rangeslider--horizontal {
            height: 9px;
        }
        .playerMenu-setting-reticle-param-item-progress .rangeslider__fill {
            height: 9px;
        }
        .playerMenu-setting-reticle-param-item-progress .rangeslider__handle {
            width: 15px;
            height: 15px;
        }
        .playerMenu-setting-reticle-param-item-color .vc-chrome {
            background: transparent;
            box-shadow: none;
        }
        .playerMenu-setting-reticle-param-item-color .vc-chrome-alpha-wrap {
            margin-top: 10px;
        }
        .playerMenu-setting-reticle-param-item-color .vc-chrome-controls {
            display: flex;
            align-items: center;
        }
        .playerMenu-setting-reticle-param-item-color .vc-chrome-hue-wrap { 
            margin-bottom: 0px;
        }
        .playerMenu-setting-reticle-param-item-color .vc-chrome-body {
            position: relative;
            background: transparent;
            margin-top: 5px;
            padding: 0px;
        }
        .playerMenu-setting-reticle-param-item-color .vc-chrome-toggle-btn {
            display: none;
        }
        .playerMenu-setting-reticle-param-item-color .vc-chrome-fields-wrap {
            padding-top: 10px;
        }
        .playerMenu-setting-reticle-param-item-color .vc-chrome-field {
            padding-left: 40px;
            width: 95px;
        }

            background: #435069;
            border: none;
            border-radius: 6px;
        }
        .playerMenu-setting-reticle-param-item-color .vc-input__input {
            background: #435069;
            color: #fff;
            border: none;
            box-shadow: none;
            border-radius: 6px;
        }
        .playerMenu-setting-reticle-param-item-color .vc-input__label {
            display: none;
        }
        .playerMenu-setting-reticle-param-item-color .vc-chrome-color-wrap {
            position: absolute;
            bottom: -5px;
        }
        .playerMenu-setting-reticle-param-item-color-disable-a .vc-chrome-alpha-wrap {
            display: none;
        }

        .playerMenu-battlePass-quest-block {
            display: inline-flex;
            align-items: center;
            width: 293px;
            height: 63px;
            padding: 10px 15px;
            background: rgba(135, 255, 176, 0.1);
            border-radius: 2px;
            font-family: Montserrat;
            font-style: normal;
            font-weight: 600;
            font-size: 16px;
            color: #FFFFFF;
            box-sizing: border-box;
        }
        .playerMenu-battlePass-quest-block.complete {
            background: rgba(135, 255, 176, 0.25);
            color: #B7FF7D;
        }

        .playerMenu-battlePass-levelPrice-block {
            display: flex;
            align-items: center;
            padding: 14px 10px;
            margin-bottom: 3px;
            background: rgba(6, 30, 38, 0.32);
            border-radius: 5px;
        }
        .playerMenu-battlePass-levelPrice-block:hover {
            background: rgba(47, 115, 90, 0.32);
        }
        .playerMenu-battlePass-levelPrice-block.active {
            background: rgba(115, 255, 146, 0.3);
        }

        #playerMenuBattlePassAwardWrapper {
            width: 900px;
            height: 180px;
            margin: 0px 10px;
            overflow-x: hidden;
            white-space: nowrap;
        }
        #playerMenuBattlePassAwardWrapper::-webkit-scrollbar {
            display: none;
        }
        .playerMenu-battlePass-award-block {
            position: relative;
            display: inline-block; 
            width: 145px; 
            height: 144px; 
            background: rgba(5, 1, 54, 0.37); 
            margin: 0px 3px;
            border-radius: 6px;
        }
        .playerMenu-battlePass-award-block.active {
            background: #099E4D;
        }
        .playerMenu-battlePass-award-block.got {
            background: #00BD4C;
        }
        .playerMenu-battlePass-award-block.empty {
            width: 25px;
        }
        .playerMenu-battlePass-award-block-text {
            position: absolute;
            top: 7px;
            left: 12px;
            color: rgba(105, 255, 165, 0.77);
        }
        .playerMenu-battlePass-award-block-image {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 145px;
            max-height: 144px;
        }
        .playerMenu-battlePass-award-block-button {
            position: absolute;
            bottom: -10px;
            left: 0px;
            width: 100%;
            background: linear-gradient(270deg, #00AD30 0%, #DBFF00 100%);
            box-shadow: 4px 1px 31px rgba(51, 255, 0, 0.46);
            border-radius: 2px;
            font-family: Montserrat;
            font-style: normal;
            font-weight: 500;
            font-size: 14px;
            text-align: center;
            color: #FFFFFF;
            padding: 2px;
            box-sizing: border-box;
        }

        #rouletteTableBlock {
            position: relative;
            overflow-x: hidden;
            width: 955px;
        }
        #rouletteTableSpin {
            white-space: nowrap;
        }
        #rouletteSpinStripe {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 2px;
            height: 233px;
            background: linear-gradient(180deg, rgba(0, 255, 163, 0) 0%, #00FFA3 18.75%, #00B53D 84.37%, rgba(0, 181, 61, 0) 100%);
            z-index: 3;
        }
        .gRoulette-spin-prize-image-block {
            display: inline-block;
            position: relative;
            width: 185px;
            height: 185px;
            margin-left: 10px;
            background: linear-gradient(180deg, rgba(9, 0, 117, 0) 0%, rgba(0, 255, 102, 0.38) 100%);
            border-radius: 4px;
        }
        .gRoulette-spin-prize-image {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 185px;
            max-height: 185px;
            z-index: 2;
        }
        .gRoulette-spin-prize-image-block-mini {
            display: inline-block;
            position: relative;
            width: 75px;
            height: 75px;
            margin-right: 4px;
            background: linear-gradient(180deg, rgba(0, 255, 102, 0) 0%, rgba(0, 255, 102, 0.38) 100%);
            border-radius: 4px;
        }
        .gRoulette-spin-prize-image-block-mini:last-child {
            margin-right: 0px;
        }
        .gRoulette-spin-prize-image-mini {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 75px;
            max-height: 75px;
            z-index: 2;
        }

    </style>
</head>

                                    <button @click="setPointTo(1194.03, -1480.86, 33.85)" class="yk-btn s-15 p-10-15 green">Станция 2</button>
                                    <button @click="setPointTo(1691.55, 3585.87, 34.62)" class="yk-btn s-15 p-10-15 green">Станция 3</button>

                    </div>
                    <div v-if="currentHelpTabIndex === 2">
                        <mainmenu-helpitem :header="'Организации на сервере'" class="list-mt-10">
                            <div>
                                <div>На сервере есть легальные и нелегальные фракции, а также неофициальные организации, сами определяющие свой путь.</div>
                                <div>Легальные: Армия, Полиция, Шерифы, FIB, Медики, Новости, Правительство</div>
                                <div>Нелегальные: Банды (5) и Мафии (5)</div>
                                <div>Места всех организаций отмечены на карте.</div>
								<div>Каждая фракция имеет свой особый функционал и отыгрывает соответствующие роли. К выбору организации нужно подходить серьезно и обдуманно.</div>
								<div>Наборами во все фракции занимаются исключительно лидеры и текущий состав этих фракций, о наборах в криминальные организации, обычно, завуалировано оповещают в рекламе, а в государственные - открыто в желтые государственные новости.</div>
                            </div>
                        </mainmenu-helpitem>
                        <mainmenu-helpitem :header="'Армия'" class="list-mt-10">
                            <div>
                                <div>Армия занимается перевозкой материалов для нужд других государственных организаций и готовит бойцов для других силовых фракций.</div>
                                <div>В момент службы в армии Вы можете получить военный билет!</div>
                                <div>Список доступных кнопок:</div>
                                <div>[X] - надеть наручники на человека.</div>
                                <div>[Z] - вести игрока за собой.</div>
								<div>[G] > Работа - остальной доступный функционал.</div>
                            </div>
                        </mainmenu-helpitem>
                        <mainmenu-helpitem :header="'EMS'" class="list-mt-10">
                            <div>
                                <div>EMS оказывает помощь гражданам при заболеваниях связанных с зависимостью.</div>
                                <div>Помимо этого, сотрудники помогают игрокам с лечением зависимостей и психологических проблем.</div>
                                <div>Первостепенной задачей является выезд на вызовы от граждан и их последующая реанимация.</div>
                                <div>Занимаются перевозкой медикаментов и их поставкой другим государстенным структурам.</div>
                                <div>Список доступных кнопок:</div>
                                <div>Основное взаимодействие с персонажами идет через кнопку [G] > Работа.</div>
                            </div>
                        </mainmenu-helpitem>
                        <mainmenu-helpitem :header="'Правительство'" class="list-mt-10">
                            <div>
                                <div>Правительство - исполнительный орган государственного управления.</div>
                                <div>Задачей правительства является контроль над государственными структурами и их обеспечением.</div>
                                <div>Все перевозки медикаментов и материалов производятся по заказу от Правительства. </div>
                                <div>Правительство занимает ключевую и главенствующую роль в системе государственных организаций штата и включает в себя не только законодательную часть власти, но и прокуратуру и суд.</div>
                                <div>Помимо этого Правительство занимается выдачей лицензий, а именно:</div>
                                <div>- лицензия на адвокатскую деятельность.</div>
                                <div>- лицензия на ношение оружия.</div>
                                <div>- лицензия на владение бизнесом</div>
								<div>- лицензия на рыбалку</div>
                                <div>Список доступных кнопок:</div>
                                <div>В основном все взаимодействие идет через кнопку [G] > Работа.</div>
                                <div>[X] - надеть наручники на человека для сотрудников USSS.</div>
                                <div>[Z] - вести игрока за собой для сотрудников USSS.</div>
                                <div>'Телефон > Браузер > ls.gov' - база данных преступников и государственные новости.</div>
                            </div>
                        </mainmenu-helpitem>
                        <mainmenu-helpitem :header="'FIB/LSPD/LSSD'" class="list-mt-10">
                            <div>
                                <div>FIB/LSPD/LSSD - занимаются проведением мероприятий нацеленных на уменьшение уровня преступности в штате и защиту граждан.</div>
                                <div>FIB - является правоохранительным и контрразведывательным ведомством, в основном они занимаются расследованиями и сбором информации.</div>
                                <div>LSPD и LSSD занимаются расследованием и предотвращением рядовых преступлений в рамках своих юрисдикций, где LSPD отвечает за Лос Сантос, а LSSD - за округ Блэйн.</div>
                                <div>Список доступных кнопок:</div>
                                <div>В основном все взаимодействие идет через кнопку [G] > Работа.</div>
                                <div>[X] - надеть наручники на человека.</div>
                                <div>[Z] - вести игрока за собой.</div>
                                <div>[M] > 'КПК' - бортовой компьютер.</div>
                                <div>'Телефон > Браузер > ls.gov' - база данных преступников и государственные новости.</div>
                            </div>
                        </mainmenu-helpitem>
                        <mainmenu-helpitem :header="'Федеральная тюрьма'" class="list-mt-10">
                            <div>
                                <div>Федеральная тюрьма или SASPA (San Andreas State Prison Authority) - фракция, предназначенная для приема и организации людей, отбывающих наказание по федеральным статьям.</div>
                                <div>Ключевая задача фракции - прием и оформление новых заключенных и поддержание порядка внутри тюрьмы. Функционал наручников и конвоирования ограничен территорией тюрьмы.</div>
                                <div>Сотрудники фракции могут открывать и закрывать любые двери на территории тюрьмы, повышать или понижать срок заключенным за нарушения или хорошее поведение, соответственно.</div>
                                <div>Список доступных кнопок:</div>
                                <div>В основном все взаимодействие идет через кнопку [G] > Работа или на маркере 'Оформление' в центре тюрьмы.</div>
                                <div>[X] - надеть наручники на человека на территории тюрьмы.</div>
                                <div>[Z] - вести игрока за собой на территории тюрьмы.</div>
                                <div>[M] > 'Личные дела' - список заключенных онлайн и управление их личными делами.</div>
                                <div>'Телефон > Браузер > ls.gov' - база данных преступников и государственные новости.</div>
                            </div>
                        </mainmenu-helpitem>
                        <mainmenu-helpitem :header="'Weazel News'" class="list-mt-10">
                            <div>
                                <div>Weazel News - новостное агентство штата.</div>
                                <div>Это огромная новостная сеть с тремя отделами новостей: телевидение, радиоэфиры и пресса.</div>
                                <div>Номер студии: 995-105.</div>
                                <div>Список доступных кнопок:</div>
                                <div>В основном все взаимодействие идет через кнопку [G] > Работа.</div>
                                <div>[M] > 'Меню редактора' - специальное меню для редактирования и публикации новостей.</div>
                            </div>
                        </mainmenu-helpitem>
						<mainmenu-helpitem :header="'Неофициальные организации'" class="list-mt-10">
                            <div>
                                <div>Любой игрок может создать свою неофициальную организацию, чтобы реализовать свои уникальные задумки, которые не предусмотрены фракциями.</div>
                                <div>Неофициальные организации могут запросить некоторый функционал у администрации, например, возможность использовать стяжки и конвоирование, путем создания скриншот-ситуации на форуме проекта.</div>
                                <div>Организации могут приобретать в свою собственность офис, который откроет им доступ к заработку на контрактах и складу, и особняк, который позволит покупать в собственность организации автомобили, доступные всем её членам.</div>
                                <div>Создание неофициальной организации стоит 800.000$ или 2000 DP и доступно у NPC в Мэрии ЛС.</div>
                                <div class="mt-10 yk-btn-h-list">
                                    <button @click="setPointTo(-577.33, -196.25)" class="yk-btn s-15 p-10-15 green">Создание организации</button>
                                </div>
                            </div>
                        </mainmenu-helpitem>
                    </div>
                </div>
            </div>
        </div>

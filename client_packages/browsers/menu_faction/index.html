    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: transparent !important;
        overflow: hidden;
      }
      body.faction-hidden #faction { display: none !important; }
      #faction {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: auto;
      }
      /* Разрешить клики по кнопкам даже если disabled снят через права */
      #faction button.yk-btn { pointer-events: auto; cursor: pointer; }
      #faction button.yk-btn:disabled { opacity: 0.35; cursor: not-allowed; }

      /* Фиксированная ширина — без прыжков при смене вкладок / скроллбара */
      #faction .faction-shell {
        width: 800px;
        min-width: 800px;
        max-width: 800px;
        box-sizing: border-box;
      }
      #faction .faction-shell > .yk-block {
        width: 800px;
        min-width: 800px;
        max-width: 800px;
        box-sizing: border-box;
      }
      #faction .yk-tab-block-h {
        overflow: hidden;
        min-height: 54px;
        box-sizing: border-box;
      }
      #faction .yk-tab-button {
        flex-shrink: 0;
      }
      #faction .faction-logs-block,
      #faction .faction-logs-content,
      #faction .faction-logs-scroll {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        overflow-x: hidden;
        box-sizing: border-box;
      }
      #faction .faction-logs-toolbar {
        flex: 0 0 auto;
        min-width: 0;
        padding-right: 5px;
        box-sizing: border-box;
      }
      #faction .faction-logs-toolbar .yk-input-block {
        width: min(360px, 52%);
        min-width: 0;
      }
      #faction .faction-logs-row,
      #faction .faction-logs-scroll .yk-table-header,
      #faction .faction-logs-scroll .yk-table-row {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        box-sizing: border-box;
      }
      #faction .faction-logs-row > div,
      #faction .faction-logs-scroll .yk-table-header > div {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #faction .faction-close-x {
        position: relative;
        z-index: 5;
        cursor: pointer;
        flex-shrink: 0;
      }
      #faction .yk-tab-button.active:before,
      #faction .yk-tab-button.active:after {
        pointer-events: none;
      }
      #faction .yk-scroll {
        scrollbar-gutter: stable;
      }
      #faction .faction-panel {
        width: 800px !important;
        min-width: 800px;
        max-width: 800px;
        height: 530px !important;
        box-sizing: border-box;
        overflow: hidden;
      }
      #faction .yk-checkbox:checked:before {
        display: none;
        content: none;
        background: none;
      }
    </style>
    <style>

        .factionMenu-members-item {
            margin-top: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .factionMenu-members-item:first-child {
            margin-top: 0px;
        }

    </style>
</head>

<script>

(function () {
  if (typeof serverAPI !== 'undefined' && serverAPI && !serverAPI.errorNotify) {
    serverAPI.errorNotify = function (msg) { serverAPI.notifyError(msg); };
  }

  window.__factionRpcPending = window.__factionRpcPending || {};

  window.__factionRpcResult = function (id, ok, payload) {
    var p = window.__factionRpcPending[id];
    if (!p) return;
    delete window.__factionRpcPending[id];
    if (ok) p.resolve(payload);
    else p.reject(payload || 'Ошибка');
  };

  function bridgeCallServer(name, args) {
    return new Promise(function (resolve, reject) {
      var id = String(Date.now()) + '_' + Math.floor(Math.random() * 1e9);
      window.__factionRpcPending[id] = { resolve: resolve, reject: reject };
      try {
        mp.trigger('factionMenu:rpc', name, JSON.stringify(args === undefined ? null : args), id);
      } catch (e) {
        delete window.__factionRpcPending[id];
        reject(String(e));
      }
      setTimeout(function () {
        if (window.__factionRpcPending[id]) {
          delete window.__factionRpcPending[id];
          reject('TIMEOUT');
        }
      }, 15000);
    });
  }

  async function saveFactionRank(v) {
    if (!v || !v.form || v.form.rankSaving) return;
    v.$set(v.form, 'rankSaving', true);
    v.$set(v.form, 'rankSaveResponse', '');
    v.$set(v.form, 'rankSaveHasError', false);
    try {
      var index = parseInt(v.rankEdit && v.rankEdit.index, 10);
      var name = String((v.rankEdit && v.rankEdit.rank) || '').trim();
      var permissions = v.rankEdit && v.rankEdit.permissions;
      if (!Number.isInteger(index) || index < 0 || index > 8) {
        throw 'Нельзя редактировать этот ранг';
      }
      if (!name) throw 'Введите название должности';
      if (!Array.isArray(permissions)) throw 'Некорректные права ранга';

      // Вызываем мост напрямую: этот путь не зависит от переопределений rage-rpc в шаблоне.
      var result = await bridgeCallServer('server_faction_manage_rank_setPermission', [
        index, name, permissions.slice()
      ]);
      if (!result || result.error) {
        throw (result && result.errorText) || 'Не удалось сохранить настройки ранга';
      }

      v.rankPermissions.splice(index, 1, permissions.slice());
      v.rankNameList.splice(index, 1, name);
      var rankN = index + 1;
      (v.members || []).forEach(function (m) {
        if (m.rankN === rankN) m.rank = name;
      });
      v.form.rankSaveResponse = 'Настройки ранга сохранены';
      v.form.rankSaveHasError = false;
      v.settingTab = 0;
    } catch (e) {
      v.form.rankSaveResponse = String(e || 'Не удалось сохранить настройки ранга');
      v.form.rankSaveHasError = true;
      try { serverAPI.notifyError(e); } catch (_e) {}
    } finally {
      v.form.rankSaving = false;
    }
  }

  var _origCallServer = rpc.callServer.bind(rpc);
  rpc.callServer = function (name, args, options) {
    if (typeof name === 'string' && name.indexOf('server_faction_') === 0) {
      return bridgeCallServer(name, args);
    }
    return _origCallServer(name, args, options);
  };

  function mapRawMembers(v, rawMembers) {
    var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
    return (rawMembers || []).map(function (row) {
      var ts = parseInt(row[3], 10) || 0;
      var c = ts > 0 ? new Date(1000 * ts) : null;
      var rankN = parseInt(row[2], 10) || 1;
      var sid = parseInt(row[4], 10) || 0;
      return {
        name: String(row[0] || '').replace(/_/g, ' '),
        static: sid,
        isOnline: !!row[1],
        rank: (v.rankNameList && v.rankNameList[rankN - 1]) || ('Ранг ' + rankN),
        rankN: rankN,
        lastActive: c
          ? (pad(c.getDate()) + '/' + pad(c.getMonth() + 1) + '/' + c.getFullYear() +
            ' ' + pad(c.getHours()) + ':' + pad(c.getMinutes()))
          : '—'
      };
    }).sort(function (a, b) { return b.rankN - a.rankN; });
  }

  function formatFactionLogTime(t) {
    if (!t) return '—';
    try {
      var d = new Date(t);
      if (isNaN(d.getTime())) return String(t);
      var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
      return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    } catch (_e) {
      return String(t);
    }
  }

  window.factionMenuSetLogs = function (json) {
    try {
      var mgr = typeof factionMenu !== 'undefined' ? factionMenu : null;
      var v = mgr && mgr.vue;
      if (!v) return;
      if (v.__logsLoadTimer) {
        clearTimeout(v.__logsLoadTimer);
        v.__logsLoadTimer = null;
      }
      var list = typeof json === 'string' ? JSON.parse(json) : (json || []);
      v.logsList = Array.isArray(list) ? list : [];
      v.logsLoading = false;
    } catch (_e) {
      try {
        var mgr2 = typeof factionMenu !== 'undefined' ? factionMenu : null;
        if (mgr2 && mgr2.vue) mgr2.vue.logsLoading = false;
      } catch (_e2) {}
    }
  };

  try {
    if (typeof factionMenu !== 'undefined' && factionMenu.vue) {
      factionMenu.vue.formatFactionLogTime = formatFactionLogTime;
      if (typeof factionMenu.vue.requestLogs !== 'function') {
        factionMenu.vue.requestLogs = function () {};
      }
      if (typeof factionMenu.vue.openLogsTab !== 'function') {
        factionMenu.vue.openLogsTab = function () { this.tab = 4; };
      }
    }
  } catch (_seed) {}

  /** Soft-update участников: не трогает membersSearch / tab / формы. */
  window.factionMenuUpdateMembers = function (rawMembers, meta) {
    try {
      var mgr = typeof factionMenu !== 'undefined' ? factionMenu : null;
      var v = mgr && mgr.vue;
      if (!v) return;
      var list = mapRawMembers(v, rawMembers);
      v.members = list;
      v.membersCount = list.length;
      v.membersOnline = list.filter(function (m) { return m.isOnline; }).length;
      if (meta && meta.notifyLeader != null) {
        v.notify = v.notify || { text: '', leader: '' };
        v.notify.leader = String(meta.notifyLeader || '');
      }
    } catch (_e) {}
  };

  function patchFactionVue() {
    var mgr = typeof factionMenu !== 'undefined' ? factionMenu : null;
    var v = mgr && mgr.vue;
    if (!v) return;
    if (v.__flowPatched) return;
    v.__flowPatched = true;

    var _origLoad = v.__load ? v.__load.bind(v) : null;
    if (_origLoad) {
      v.__load = function (payload) {
        _origLoad(payload);
        this.canViewLogs = !!(payload && (payload.canViewLogs || (payload.permissions && payload.permissions.isLeader)));
        if (Array.isArray(payload && payload.members) && payload.members.length && Array.isArray(payload.members[0])) {
          var remapped = mapRawMembers(this, payload.members);
          this.members = remapped;
          this.membersCount = remapped.length;
          this.membersOnline = remapped.filter(function (m) { return m.isOnline; }).length;
        }
      };
    }

    // Поиск без учёта регистра (ник Absolute / absolute).
    // Не трогаем Vue computed напрямую — патчим через $options + принудительный refresh
    // через обёртку filter в шаблоне нельзя; переопределяем getter на инстансе.
    try {
      Object.defineProperty(v, 'membersList', {
        configurable: true,
        enumerable: true,
        get: function () {
          var q = String(this.membersSearch || '').replace(/_/g, ' ').toLowerCase().trim();
          var list = (this.members || []).filter(function (m) {
            if (!q) return true;
            var name = String(m.name || '').toLowerCase();
            var sid = String(m.static || '');
            return name.indexOf(q) !== -1 || sid.indexOf(q) !== -1;
          });
          if (this.enableOnlineSort) {
            list = list.slice().sort(function (a, b) {
              return (b.isOnline ? 1 : 0) - (a.isOnline ? 1 : 0);
            });
          }
          return list;
        }
      });
    } catch (_e) {}

    var _createNews = v.createNews.bind(v);
    v.createNews = async function (title, text) {
      var c = '';
      try {
        c = await rpc.callServer('server_faction_manage_new_news', [title, text]);
      } catch (e) {
        c = 'Ошибка клиента.';
      }
      var ok = false;
      var item = null;
      if (c === 'ok') ok = true;
      else if (c && typeof c === 'object') {
        if (c.error) {
          c = c.errorText || 'Ошибка';
        } else {
          ok = true;
          item = c.data || c.item || null;
        }
      }
      if (ok) {
        this.form.newsAddResponse = 'Новость создана.';
        this.form.newsAddHasError = false;
        this.form.newsTitle = '';
        this.form.newsText = '';
        if (!item) {
          var d = new Date();
          var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
          item = {
            title: title,
            text: text,
            date: pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes())
          };
        }
        if (!Array.isArray(this.news)) this.news = [];
        this.news.unshift(item);
      } else {
        this.form.newsAddResponse = c;
        this.form.newsAddHasError = true;
        serverAPI.notifyError(c);
      }
    };

    var _setNotify = v.setNotify.bind(v);
    v.setNotify = async function (text) {
      var b = '';
      try {
        b = await rpc.callServer('server_faction_manage_notify', text);
      } catch (e) {
        b = 'Ошибка клиента.';
      }
      if (b === 'ok') {
        this.form.notifySetResponse = 'Оповещение установлено.';
        this.form.notifySetHasError = false;
        this.notify = this.notify || { text: '', leader: '' };
        this.notify.text = String(text || '');
        this.form.notifyText = this.notify.text;
      } else {
        this.form.notifySetResponse = b;
        this.form.notifySetHasError = true;
        serverAPI.notifyError(b);
      }
    };

    v.formatFactionLogTime = formatFactionLogTime;

    v.requestLogs = function (q) {
      if (!(this.canViewLogs || (this.permissions && this.permissions.isLeader))) {
        try { serverAPI.notifyError('Нет прав на логи'); } catch (_e) {}
        return;
      }
      this.logsLoading = true;
      var search = q != null ? String(q) : String(this.logsSearch || '');
      var self = this;
      if (self.__logsLoadTimer) clearTimeout(self.__logsLoadTimer);
      self.__logsLoadTimer = setTimeout(function () {
        if (self.logsLoading) self.logsLoading = false;
      }, 12000);
      try { mp.trigger('frac:logs:request', search); } catch (_e2) {
        this.logsLoading = false;
      }
    };

    v.openLogsTab = function () {
      this.tab = 4;
      this.requestLogs(this.logsSearch);
    };

    // Повышение/понижение по static; clamp 1–9.
    v.changeRank = async function (member, mode) {
      try {
        var sid = parseInt(member.static, 10) || 0;
        var key = sid > 0
          ? ('_(#' + sid + ')')
          : String(member.name || '').replace(/ /g, '_');
        var c = await serverAPI.getAsync('server_faction_manage_members_rank', { name: key, mode: mode });
        member.rank = c;
        if (mode === '+') member.rankN = Math.min(9, (member.rankN || 1) + 1);
        else member.rankN = Math.max(1, (member.rankN || 1) - 1);
      } catch (e) {
        serverAPI.notifyError(e);
      }
    };

    v.unInvite = async function (member) {
      var sid = parseInt(member.static, 10) || 0;
      var key = sid > 0
        ? ('_(#' + sid + ')')
        : String(member.name || '').replace(/ /g, '_');
      var res = await rpc.callServer('server_faction_manage_members_unInvite', key);
      var err = res && typeof res === 'object' ? res.error : 1;
      if (err != 1) {
        this.members = this.members.filter(function (m) {
          if (sid > 0) return parseInt(m.static, 10) !== sid;
          return m.name != member.name;
        });
        this.membersCount = this.members.length;
        this.membersOnline = this.members.filter(function (m) { return m.isOnline; }).length;
      } else {
        serverAPI.notifyError('Нет прав или игрок недоступен');
      }
    };

    v.changeWarehouseCloseStatus = async function (closed) {
      if (!this.permissions.warehouseToggle) {
        serverAPI.notifyError('Нет прав на склад');
        return;
      }
      try {
        var result = await rpc.callServer('server_faction_manage_warehouse_closeStatus', !!closed);
        if (result !== 'ok') throw result || 'Не удалось изменить состояние склада';
        this.warehouseCloseStatus = !!closed;
      } catch (e) {
        serverAPI.notifyError(e);
      }
    };

    v.saveRankSetting = async function () {
      return saveFactionRank(this);
    };

    // Редактирование прав рангов доступно только лидеру: это исключает повышение прав своего ранга.
    var _start = v.startRankEdit.bind(v);
    v.startRankEdit = function (idx) {
      if (!this.permissions.isLeader) {
        serverAPI.notifyError('Нет прав');
        return;
      }
      this.$set(this.form, 'rankSaveResponse', '');
      this.$set(this.form, 'rankSaveHasError', false);
      _start(idx);
    };
  }

  window.factionMenuOpen = function (payload) {
    try {
      document.body.classList.remove('faction-hidden');
      payload = payload || {};
      if (!payload.permissions) payload.permissions = { isLeader: false, changeRank: false, unInvite: false, warehouseToggle: false };
      if (!Array.isArray(payload.members)) payload.members = [];
      if (!Array.isArray(payload.news)) payload.news = [];
      if (!Array.isArray(payload.logsList)) payload.logsList = [];
      if (!payload.notify) payload.notify = { text: '', leader: '' };
      if (!Array.isArray(payload.vehList)) payload.vehList = [];
      if (!Array.isArray(payload.rankPermissions)) payload.rankPermissions = [];
      if (!Array.isArray(payload.rankAllPermissions)) payload.rankAllPermissions = [];
      if (!Array.isArray(payload.rankNameList)) payload.rankNameList = [];
      if (!Array.isArray(payload.acrList)) payload.acrList = [];
      if (!Array.isArray(payload.weaponSetList)) payload.weaponSetList = [];
      if (!Array.isArray(payload.weaponForSetList)) payload.weaponForSetList = [];
      var mgr = typeof factionMenu !== 'undefined' ? factionMenu : null;
      if (mgr && mgr.vue) {
        try { mgr.vue.load(payload); } catch (e) { try { console.log(e); } catch (_e) {} }
        mgr.vue.loaded = true;
        mgr.vue.canViewLogs = !!(payload.canViewLogs || (payload.permissions && payload.permissions.isLeader));
        mgr.vue.logsList = [];
        mgr.vue.logsSearch = '';
        mgr.vue.logsLoading = false;
        if (mgr.vue.permissions) {
          mgr.vue.permissions.warehouseToggle = !!(payload.permissions && payload.permissions.warehouseToggle);
        }
        if (Array.isArray(payload.members) && payload.members.length && Array.isArray(payload.members[0])) {
          var remapped = mapRawMembers(mgr.vue, payload.members);
          mgr.vue.members = remapped;
          mgr.vue.membersCount = remapped.length;
          mgr.vue.membersOnline = remapped.filter(function (m) { return m.isOnline; }).length;
        }
      } else if (typeof rpc !== 'undefined' && rpc.trigger) {
        rpc.trigger('menuManager_menu_open', { menu: 'faction', data: payload });
      }
      patchFactionVue();
      setTimeout(patchFactionVue, 50);
      setTimeout(patchFactionVue, 250);
    } catch (e) {
      try { console.log(e); } catch (_e) {}
      try { if (typeof factionMenu !== 'undefined' && factionMenu.vue) factionMenu.vue.loaded = true; } catch (_e2) {}
    }
  };
  window.factionMenuHide = function () {
    try {
      if (typeof rpc !== 'undefined' && rpc.trigger) {
        rpc.trigger('menuManager_menu_close', 'faction');
      }
      var mgr = typeof factionMenu !== 'undefined' ? factionMenu : null;
      if (mgr && mgr.vue) mgr.vue.settingTab = 0;
      document.body.classList.add('faction-hidden');
    } catch (e) { console.log(e); }
  };
  document.addEventListener('click', function (event) {
    var target = event.target;
    if (!target || target.id !== 'factionRankSave') return;
    event.preventDefault();
    event.stopImmediatePropagation();
    var mgr = typeof factionMenu !== 'undefined' ? factionMenu : null;
    saveFactionRank(mgr && mgr.vue);
  }, true);
  if (typeof mp !== 'undefined' && mp.trigger) {
    try { mp.trigger('frac:gta5rp:ready'); } catch (_e) {}
  }
})();

</script>

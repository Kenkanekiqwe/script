<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="../../handler/Lib/css/fonts.css?v=2">
    <link rel="stylesheet" href="../../handler/Menu/UI/style.css?v=2">
    <link rel="stylesheet" href="../../handler/Lib/css/help.css?v=2">
    <link rel="stylesheet" href="../../shared/pedtalk-gta5rp.css?v=3">
</head>
<body>
    <div id="messages" class="pedtalk-root active" v-if="NPCDialogActive">
        <div class="pedtalk-gradient"></div>
        <div id="pedMenu-block">
            <div class="yk-text w-5 s-20 pedtalk-actor">{{ NPCName }}:</div>
            <div class="yk-text s-25 mt-5 pedtalk-text">{{ NPCText }}</div>
            <div id="pedMenu-scrol" class="yk-scroll" style="max-height: 225px; margin-top: 20px;">
                <div class="pedtalk-answers-row" v-if="CrimeTasks == 1">
                    <div class="pedMenu-ansButton" @click="NPCIntercation('CrimeTakeTasks')">
                        <span class="yk-text w-4 s-20 pe-none pedtalk-answer-label">Хочу заработать</span>
                    </div>
                    <div class="pedMenu-ansButton" onclick="mp.trigger('closeygon');">
                        <span class="yk-text w-4 s-20 pe-none pedtalk-answer-label">Уйти</span>
                    </div>
                </div>
                <div class="pedtalk-answers-row" v-if="CrimeTasks == 2">
                    <div class="pedMenu-ansButton" @click="NPCIntercation('CrimeStartTaskAuto')">
                        <span class="yk-text w-4 s-20 pe-none pedtalk-answer-label">Угон авто</span>
                    </div>
                    <div class="pedMenu-ansButton" @click="NPCIntercation('CrimeTasksDefault')">
                        <span class="yk-text w-4 s-20 pe-none pedtalk-answer-label">Назад</span>
                    </div>
                </div>
                <div class="pedtalk-answers-row" v-if="CrimeTasks == 4">
                    <div class="pedMenu-ansButton" onclick="mp.trigger('quest:ygon:start:client');">
                        <span class="yk-text w-4 s-20 pe-none pedtalk-answer-label">Начать</span>
                    </div>
                    <div class="pedMenu-ansButton" @click="NPCIntercation('CrimeTakeTasks')">
                        <span class="yk-text w-4 s-20 pe-none pedtalk-answer-label">Назад</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/vue.js"></script>
    <script src="js/index.js"></script>
</body>
</html>

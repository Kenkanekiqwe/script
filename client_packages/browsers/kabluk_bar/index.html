<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="package://browsers/amunation/source/Lib/css/fonts.css">
    <link rel="stylesheet" href="package://browsers/amunation/source/Menu/UI/style.css">
    <link rel="stylesheet" href="package://browsers/amunation/source/Lib/css/help.css">
    <script type="text/javascript" src="package://browsers/amunation/source/Lib/js/vue.js"></script>
    <script type="text/javascript" src="package://browsers/amunation/source/Lib/js/preventSelection.js"></script>
    <style>
        #club_shop {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }
        #club_shop .content-block,
        #club_shop .yk-block,
        #club_shop button,
        #club_shop input,
        #club_shop svg,
        #club_shop img {
            pointer-events: auto;
        }
        #club_shop .yk-scroll img {
            object-fit: contain;
        }
        #club_shop .shop-product-buy {
            position: absolute;
            bottom: 10px;
            left: 50%;
            width: 90%;
            height: 32px;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #club_shop .shop-price-button {
            width: 100%;
            height: 32px;
            padding: 0 6px;
            border: 0;
            box-shadow: none;
            font-family: 'Geometria Medium';
            font-size: 16px;
            white-space: nowrap;
            transition: none;
            pointer-events: none;
        }
        #club_shop .shop-hover-buy {
            width: 100%;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 8px;
        }
        #club_shop .shop-cash-icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 76px;
            height: 32px;
            padding: 0;
            border: 0;
            outline: 0;
            border-radius: 4px;
            background: rgba(78, 211, 100, 0.12);
            box-shadow: none;
            cursor: pointer;
            transition: none;
        }
        #club_shop .shop-cash-icon-btn svg {
            fill: #4ed364;
            pointer-events: none;
        }
        #club_shop .shop-cash-icon-btn:hover:not(:disabled),
        #club_shop .shop-cash-icon-btn:active:not(:disabled) {
            background: rgba(78, 211, 100, 0.12);
            transform: none;
            filter: none;
        }
        #club_shop .shop-cash-icon-btn:disabled {
            opacity: 0.55;
            cursor: default;
        }
        #club_shop .shop-count-input-wrap {
            display: inline-flex;
            width: 68px;
            height: 32px;
            padding: 0;
            border-radius: 4px;
            background: #171d27;
            box-shadow: inset 0 4px 4px rgba(0, 0, 0, 0.07);
        }
        #club_shop .shop-count-input {
            width: 100%;
            min-width: 0;
            padding: 0 6px;
            border: 0;
            outline: 0;
            background: transparent;
            color: #fff;
            font-family: 'Geometria Medium';
            font-size: 15px;
            text-align: center;
            appearance: textfield;
        }
        #club_shop .shop-count-input::-webkit-inner-spin-button,
        #club_shop .shop-count-input::-webkit-outer-spin-button {
            margin: 0;
            -webkit-appearance: none;
        }
    </style>
</head>
<body scroll="no" style="overflow: hidden; background: transparent;">

<svg width="0" height="0" aria-hidden="true" style="position: absolute;">
    <defs>
        <linearGradient id="ykTabGradActive" gradientTransform="rotate(90)">
            <stop offset="0%" stop-color="#FFB800"/>
            <stop offset="100%" stop-color="#FA5C01"/>
        </linearGradient>
    </defs>
</svg>

<div id="club_shop">
    <template>
        <div v-if="loaded" class="content-block center">

            <div class="yk-block" style="background: radial-gradient(122.31% 217.44% at 1.56% 94.83%, #293342 0%, #121720 100%); width: 800px;">
                <div class="yk-tab-block-h">
                    <button class="yk-tab-button active">
                        <span class="yk-tab-button-text">КАБЛУК</span>
                    </button>
                    <svg @click="closeShop()" class="ml-auto" width="14" height="14" viewBox="0 0 14 14" style="cursor: pointer;">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M8.41425 7.00025L13.7072 1.70725C14.0982 1.31625 14.0982 0.68425 13.7072 0.29325C13.3162 -0.09775 12.6842 -0.09775 12.2933 0.29325L7.00025 5.58625L1.70725 0.29325C1.31625 -0.09775 0.68425 -0.09775 0.29325 0.29325C-0.09775 0.68425 -0.09775 1.31625 0.29325 1.70725L5.58625 7.00025L0.29325 12.2933C-0.09775 12.6842 -0.09775 13.3162 0.29325 13.7072C0.48825 13.9022 0.74425 14.0002 1.00025 14.0002C1.25625 14.0002 1.51225 13.9022 1.70725 13.7072L7.00025 8.41425L12.2933 13.7072C12.4882 13.9022 12.7443 14.0002 13.0002 14.0002C13.2562 14.0002 13.5122 13.9022 13.7072 13.7072C14.0982 13.3162 14.0982 12.6842 13.7072 12.2933L8.41425 7.00025Z" fill="#4D5E77"/>
                    </svg>
                </div>
            </div>

            <div class="yk-block d-flex flex-1 mt-20" style="height: 520px; width: 800px; position: relative;">
                <div class="yk-content d-flex flex-1" style="padding: 10px 10px 30px 10px;">
                    <div class="yk-scroll text-center flex-1" style="flex-shrink: 0;">
                        <div
                            v-for="p in products"
                            :key="p.id"
                            style="display: inline-block; width: 166px; height: 229px; border-radius: 4px; position: relative; margin: 12px; cursor: pointer;"
                            :style="{'background': selectedProductIndex === p.id ? '#30405A' : '#233045'}"
                            @click="selectProduct(p)"
                        >
                            <img :src="p.image" style="max-width:94px;max-height:94px;position:absolute;top:30px;left:50%;transform:translateX(-50%);">
                            <div style="position: absolute; top: 140px; left: 50%; transform: translateX(-50%); width: 95%; text-align: center;" class="yk-text w-7 s-14">{{ p.name }}</div>
                            <div
                                @click.stop
                                @mouseenter="p.buyInfo = true"
                                @mouseleave="p.buyInfo = false"
                                class="shop-product-buy"
                            >
                                <button
                                    v-show="!p.buyInfo"
                                    type="button"
                                    class="yk-btn orange shop-price-button"
                                >
                                    {{ p.priceDisplay }}$
                                </button>
                                <div v-show="p.buyInfo" class="shop-hover-buy">
                                    <button
                                        type="button"
                                        class="shop-cash-icon-btn"
                                        :disabled="p.buying"
                                        @click.stop="buy(p)"
                                        title="Оплатить наличными"
                                    >
                                        <svg width="31" height="19" viewBox="0 0 31 19" aria-hidden="true">
                                            <path d="M23.427 4.58923H7.57308C7.23147 6.00508 6.13805 7.12201 4.75195 7.47096V11.529C6.13799 11.878 7.23141 12.9949 7.57308 14.4107H23.427C23.7686 12.9949 24.862 11.8779 26.2481 11.529V7.47096C24.862 7.12195 23.7686 6.00508 23.427 4.58923ZM15.5 13.498C13.342 13.498 11.5863 11.7045 11.5863 9.5001C11.5863 7.29562 13.342 5.50225 15.5 5.50225C17.658 5.50225 19.4137 7.29568 19.4137 9.5001C19.4137 11.7045 17.658 13.498 15.5 13.498Z"/>
                                            <path d="M30.0774 -0.103882H0.922613C0.413111 -0.103882 0 0.318114 0 0.838573V18.1612C0 18.6817 0.413111 19.1037 0.922613 19.1037H30.0774C30.5869 19.1037 31 18.6817 31 18.1612V0.838573C31 0.318114 30.5869 -0.103882 30.0774 -0.103882ZM27.1707 13.2998C26.0623 13.2998 25.1607 14.221 25.1607 15.3531C25.1607 15.8736 24.7476 16.2956 24.2381 16.2956H6.762C6.25249 16.2956 5.83938 15.8736 5.83938 15.3531C5.83938 14.2209 4.93766 13.2998 3.82935 13.2998C3.31985 13.2998 2.90673 12.8778 2.90673 12.3574V6.64236C2.90673 6.1219 3.31985 5.6999 3.82935 5.6999C4.93772 5.6999 5.83938 4.77878 5.83938 3.64664C5.83938 3.12618 6.25249 2.70418 6.762 2.70418H24.238C24.7475 2.70418 25.1606 3.12618 25.1606 3.64664C25.1606 4.77885 26.0623 5.6999 27.1707 5.6999C27.6802 5.6999 28.0933 6.1219 28.0933 6.64236V12.3574C28.0933 12.8778 27.6802 13.2998 27.1707 13.2998Z"/>
                                            <path d="M15.5001 7.38708C14.3596 7.38708 13.4316 8.33492 13.4316 9.50003C13.4316 10.6651 14.3595 11.613 15.5001 11.613C16.6407 11.613 17.5686 10.6651 17.5686 9.50003C17.5686 8.33492 16.6407 7.38708 15.5001 7.38708Z"/>
                                        </svg>
                                    </button>
                                    <div class="shop-count-input-wrap">
                                        <input
                                            class="shop-count-input"
                                            type="number"
                                            min="1"
                                            step="1"
                                            v-model.number="p.buyCount"
                                            @input="normalizeProductCount(p)"
                                            @blur="normalizeProductCount(p)"
                                            @click.stop
                                        >
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>
</div>

<script type="text/javascript" src="package://browsers/kabluk_bar/app.js?v=10"></script>
</body>
</html>

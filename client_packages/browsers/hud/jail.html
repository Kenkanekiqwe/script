<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warn</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
@font-face {
    font-family: 'Montserrat';
    src: url('fonts/Montserrat-Medium.ttf') format('truetype');
    font-weight: 500;
    font-style: normal;
}
@font-face {
    font-family: 'Montserrat';
    src: url('fonts/Montserrat-SemiBold.ttf') format('truetype');
    font-weight: 600;
    font-style: normal;
}
@font-face {
    font-family: 'Montserrat';
    src: url('fonts/Montserrat-Bold.ttf') format('truetype');
    font-weight: 700;
    font-style: normal;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-user-select:none;
    user-select:none;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
    font-family:'Montserrat',sans-serif;
}

.warn-box{
    position:fixed;
    left:25px;
    bottom:280px;
    width:430px;
    padding:15px 17px 17px;
    border-radius:8px;
    overflow:hidden;
    background:
        linear-gradient(135deg,
            rgba(120,13,13,.67) 0%,
            rgba(135,17,17,.65) 55%,
            rgba(145,20,20,.62) 100%);
    display:none;
}

.warn-box p{
    position:relative;
    z-index:2;
    color:#f7e0e0;
    font-family:'Montserrat',sans-serif;
    font-size:16px;
    font-weight:500;
    line-height:1.16;
    letter-spacing:-0.15px;
    text-shadow:0 1px 1px rgba(0,0,0,.25);
    white-space:nowrap;
    margin-bottom:2px;
}

.title{
    font-size:17px;
    font-weight:500;
    margin-bottom:0px;
}

.gray{
    font-family:'Montserrat',sans-serif;
    color:#d44a4a;
    font-weight:500;
    font-size:17px;
}

b{
    font-family:'Montserrat',sans-serif;
    color:#f7e0e0;
    font-weight:600;
    font-size:17px;
}
</style>
<script>
var demorganTimer = null;

document.addEventListener('keydown', function(event) {
    if ((event.ctrlKey || event.metaKey) && String(event.key || '').toLowerCase() === 'a') {
        event.preventDefault();
        event.stopPropagation();
    }
}, true);

document.addEventListener('selectstart', function(event) {
    event.preventDefault();
}, true);

function showDemorgan(reason, admin, seconds) {
    document.querySelector('.warn-box').style.display = 'block';
    document.querySelector('.reason').innerHTML = '<b>' + reason + '</b>';
    document.querySelector('.admin').innerHTML = '<b>' + admin + '</b>';
    document.querySelector('.time').innerHTML = '<b>' + seconds + ' секунд</b>';
    if (demorganTimer) clearInterval(demorganTimer);
    demorganTimer = setInterval(function() {
        var el = document.querySelector('.time b');
        var txt = el.textContent;
        var sec = parseInt(txt);
        if (sec > 0) {
            el.textContent = (sec - 1) + ' секунд';
        } else {
            clearInterval(demorganTimer);
            demorganTimer = null;
        }
    }, 1000);
}

function hideDemorgan() {
    document.querySelector('.warn-box').style.display = 'none';
    if (demorganTimer) {
        clearInterval(demorganTimer);
        demorganTimer = null;
    }
}

function syncTime(seconds) {
    document.querySelector('.time b').textContent = seconds + ' секунд';
    if (demorganTimer) {
        clearInterval(demorganTimer);
        demorganTimer = null;
    }
    if (seconds > 0) {
        demorganTimer = setInterval(function() {
            var el = document.querySelector('.time b');
            var txt = el.textContent;
            var sec = parseInt(txt);
            if (sec > 0) {
                el.textContent = (sec - 1) + ' секунд';
            } else {
                clearInterval(demorganTimer);
                demorganTimer = null;
            }
        }, 1000);
    }
}
</script>
</head>

<body>

<div class="warn-box">
    <p class="title">Вы наказаны за нарушение правил сервера.</p>

    <p><span class="gray">Причина:</span> <span class="reason"><b>Уход в зз</b></span></p>

    <p><span class="gray">Администратор:</span> <span class="admin"><b>flery</b></span></p>

    <p><span class="gray">Осталось:</span> <span class="time"><b>300 секунд</b></span></p>
</div>

</body>
</html>

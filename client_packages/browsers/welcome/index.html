<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добро пожаловать</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="wrap" id="wrapMain">
        <div id="intro" class="intro">
            <h1><span class="brand">Flow</span> <span class="sub">DM</span></h1>
            <h2 class="hint">Нажмите <img src="./img/mouse2.png" alt=""> чтобы начать</h2>
        </div>
        <div id="loader" class="loader hidden" style="display: none;">
            <div class="bar-track">
                <div class="bar-fill" id="barFill"></div>
            </div>
            <div class="pct" id="pctLabel">0%</div>
            <p class="cap">Загрузка интерфейса</p>
        </div>
    </div>
    <div id="phaseFly" class="phase-fly" aria-hidden="true">
        <div class="phase-fly__blur"></div>
        <p class="phase-fly__hi"><span class="phase-fly__hi-welcome">Добро пожаловать на </span><span class="phase-fly__hi-flow">Flow</span><span class="phase-fly__hi-dm"> DM</span></p>
    </div>
    <script src="./js/index.js"></script>
</body>
</html>

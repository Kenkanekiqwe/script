<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Продажа кобуры</title>
    <link rel="stylesheet" href="styles.css">
    <script src="./index.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="accept">
        <div class="accept_block">
            <div class="accept_pos"></div>
            <h3>Подтверждение</h3>
            <p><b>Игрок <b id="sellerLogin">...</b> хочет продать вам <b id="coburaName">кобуру</b> за <b id="coburaPrice">0</b>$</b></p>
            <div>
                <button onclick="mp.trigger('otvetCoburaSell', 'yes');">Принять</button>
                <button onclick="mp.trigger('otvetCoburaSell', 'no');">Отклонить</button>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelector('.accept').style.display = 'none';
        });
    </script>
</body>
</html>

function getSpawnIcon(type) {
    const icons = window.SPAWN_ICONS || {};
    const raw = icons[type] || SPAWN_ICONS_EXTRA[type] || icons.faction || SPAWN_ICONS_EXTRA.def;
    if (!raw) return '';
    return raw.replace('class="spawnMenu-ico"', 'class="spawnMenu-ico pe-none"');
}

let _payload = { spawnOptions: [], fraction: 0 };
let _currentKey = null;
let _waitCamera = false;
let _waitRequest = false;

function findOption(key) {
    return (_payload.spawnOptions || []).find(function (o) { return o.key === key; }) || null;
}

function renderOptions() {
    const bar = document.getElementById('optsBar');
    const opts = _payload.spawnOptions || [];
    bar.innerHTML = opts.map(function (opt) {
        const type = opt.spawnType || 'def';
        const icon = getSpawnIcon(type);
        const name = opt.spawnName || String(opt.label || opt.key || '').toUpperCase();
        const active = _currentKey === opt.key ? ' active' : '';
        return '<div class="spawnMenu-spawnBlock' + active + '" data-key="' + opt.key + '">' +
            icon +
            '<div class="yk-text w-6 s-20 mt-5 spawnMenu-text pe-none upper">' + name + '</div>' +
            '</div>';
    }).join('');

    bar.querySelectorAll('.spawnMenu-spawnBlock').forEach(function (el) {
        el.addEventListener('click', function () {
            SpawnSelect.pick(el.getAttribute('data-key'));
        });
    });
}

function updateConfirmPanel() {
    const panel = document.getElementById('confirmPanel');
    const bar = document.getElementById('optsBar');
    const opt = _currentKey ? findOption(_currentKey) : null;
    if (bar) {
        bar.style.pointerEvents = (_waitCamera || _waitRequest) ? 'none' : 'auto';
        bar.style.opacity = (_waitCamera || _waitRequest) ? '0.72' : '1';
    }
    if (!opt || _waitCamera) {
        panel.classList.add('hidden');
        return;
    }
    panel.classList.remove('hidden');
    const warn = !!opt.warning;
    document.getElementById('warnIco').style.display = warn ? '' : 'none';
    document.getElementById('warnText').style.display = warn ? '' : 'none';
    document.getElementById('confirmBtn').disabled = _waitRequest;
}

window.SpawnSelect = {
    open(payloadJson) {
        _waitRequest = false;
        _waitCamera = false;
        _currentKey = null;
        _payload = typeof payloadJson === 'string' ? JSON.parse(payloadJson) : payloadJson;
        const bar = document.getElementById('optsBar');
        if (bar) bar.style.display = '';
        renderOptions();
        updateConfirmPanel();
        document.getElementById('playerSpawnSelect').classList.add('open');
    },
    setSelected(key) {
        _currentKey = key || null;
        renderOptions();
        updateConfirmPanel();
    },
    setWaitCamera(value) {
        _waitCamera = !!value;
        updateConfirmPanel();
    },
    pick(key) {
        if (_waitCamera || _waitRequest) return;
        if (!findOption(key)) return;
        if (_currentKey === key) return;

        _waitCamera = true;
        try {
            if (typeof mp !== 'undefined' && mp.trigger) {
                mp.trigger('spawnselect:preview', key);
            }
        } catch (_e) {
            _waitCamera = false;
            updateConfirmPanel();
        }
    },
    confirm() {
        if (!_currentKey || _waitRequest || _waitCamera) return;
        _waitRequest = true;
        document.getElementById('playerSpawnSelect').classList.remove('open');
        document.getElementById('confirmPanel').classList.add('hidden');
        const bar = document.getElementById('optsBar');
        if (bar) bar.style.display = 'none';
        document.getElementById('confirmBtn').disabled = true;
        try {
            if (typeof mp !== 'undefined' && mp.trigger) {
                mp.trigger('spawnselect:confirm', _currentKey, _payload.fraction || 0);
            }
        } catch (_e) {}
    },
    dismissInstant() {
        _waitRequest = true;
        document.getElementById('playerSpawnSelect').classList.remove('open');
        document.getElementById('confirmPanel').classList.add('hidden');
        const bar = document.getElementById('optsBar');
        if (bar) bar.style.display = 'none';
    },
    close() {
        _waitRequest = false;
        _waitCamera = false;
        _currentKey = null;
        document.getElementById('playerSpawnSelect').classList.remove('open');
        document.getElementById('confirmPanel').classList.add('hidden');
        const bar = document.getElementById('optsBar');
        if (bar) bar.style.display = '';
    }
};

document.getElementById('confirmBtn').addEventListener('click', function () {
    SpawnSelect.confirm();
});

try {
    if (typeof mp !== 'undefined' && mp.trigger) mp.trigger('spawnselect:browser:ready');
} catch (_e) {}
</script>

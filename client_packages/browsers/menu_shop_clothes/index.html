      html, body {

        height: 100%;

      #shop_clothes .yk-shadow-block-right {
        height: 100vh !important;
        max-height: 100%;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
      }

        min-height: 0;
        height: 100%;
        position: relative;
        box-sizing: border-box;
      }
      #shop_clothes #menuMainRightList {
        height: calc(100vh - 40px) !important;
        max-height: calc(100vh - 40px);
        overflow-x: hidden !important;
        overflow-y: auto !important;
        -webkit-overflow-scrolling: touch;
        box-sizing: border-box;
      }
      #shop_clothes .shop-list-scroll-hint {

        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        pointer-events: none;
        z-index: 2;

      #shop_clothes .yk-scroll {
        overflow-x: hidden !important;
        overflow-y: auto !important;
      }
      #shop_clothes .yk-shadow-block-left .yk-scroll {
        max-height: calc(100vh - 280px);
        height: auto !important;
      }
      #shop_clothes *:focus,
      #shop_clothes *:focus-visible {
        outline: none !important;
        box-shadow: none !important;
      }
      #shop_clothes .yk-btn-circle,

      #shop_clothes .yk-shadow-block-item-left,
      #shop_clothes .list-mt-10 {
        -webkit-tap-highlight-color: transparent;
      }
    </style>
    <script>
    (function () {
      function isTextInput(el) {
        if (!el || !el.tagName) return false;
        var tag = el.tagName.toLowerCase();
        if (tag === 'textarea') return true;
        if (tag === 'input') {
          var type = String(el.type || 'text').toLowerCase();
          return type !== 'checkbox' && type !== 'radio' && type !== 'button' &&
            type !== 'submit' && type !== 'reset' && type !== 'file' && type !== 'range';
        }
        return !!el.isContentEditable;
      }
      document.addEventListener('keydown', function (e) {
        if (e.key !== 'Tab' && e.keyCode !== 9) return;
        if (isTextInput(e.target) || isTextInput(document.activeElement)) return;
        e.preventDefault();
      }, true);
    })();
    </script>
